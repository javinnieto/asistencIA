services:
  db:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=asistencias
      - MYSQL_ROOT_PASSWORD=1234
    ports:
      - "3307:3306" # ✅ Ya cambiado - sin conflicto
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      start_period: 30s
    networks:
      - asist_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 100M
      MEMORY_LIMIT: 512M
      MAX_EXECUTION_TIME: 300
      PMA_ABSOLUTE_URI: http://localhost:8082/ # ✅ Cambiado a 8082
    ports:
      - "8082:80" # ✅ Cambiado de 8080 a 8082
    depends_on:
      - db
    networks:
      - asist_network

  mosquitto:
    image: eclipse-mosquitto:1.6
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1884:1883" # ✅ Cambiado de 1883 a 1884
      - "9002:9001" # ✅ Cambiado de 9001 a 9002
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - asist_network

  backend:
    build:
      context: ./backend
    container_name: backend
    restart: unless-stopped
    environment:
      - DJANGO_DB_HOST=db
      - DJANGO_DB_NAME=asistencias
      - DJANGO_DB_USER=root
      - DJANGO_DB_PASSWORD=1234
      - DJANGO_MQTT_BROKER=mosquitto
      - DJANGO_MQTT_PORT=1883
    ports:
      - "8001:8000" # ✅ Cambiado de 8000 a 8001
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - asist_network

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=http://localhost:8001/api # ✅ Actualizado con nuevo puerto
    container_name: frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - asist_network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8088:8088" # ✅ Cambiado de 80 a 8088
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
      - phpmyadmin
    networks:
      - asist_network

volumes:
  db_data:

networks:
  asist_network:
    driver: bridge
